name: Final Daily Backfill 2026-08-27 28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-daily-final-2026-08-27-28.yml'

permissions:
  contents: write

concurrency:
  group: final-daily-backfill-2026-08-27-28
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_IMAGE_MODEL: gpt-image-1
      OPENAI_IMAGE_SIZE: 1536x1024
      OPENAI_IMAGE_QUALITY: medium
      OPENAI_IMAGE_FORMAT: webp
      OPENAI_IMAGE_COMPRESSION: '84'
      FORCE_REGENERATE: 'false'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Prepare safe economical generator
        shell: bash
        run: |
          set -euo pipefail
          test -f data/current-updates-2026-08-26.js
          test -f data/current-updates-2026-08-29.js
          test ! -f data/current-updates-2026-08-27.js
          test ! -f data/current-updates-2026-08-28.js
          grep -q 'current-updates-2026-08-29.js' data/current-updates.js
          grep -q 'current-updates-2026-08-26.js' data/current-updates-2026-08-29.js
          cp data/current-updates.js /tmp/current-updates-original.js
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-daily-history.mjs')
          s = p.read_text()
          replacements = {
            'const MAX_API_ATTEMPTS = 3;': 'const MAX_API_ATTEMPTS = 2;',
            'const MAX_CONTENT_ATTEMPTS = 2;': 'const MAX_CONTENT_ATTEMPTS = 1;',
            'max_output_tokens: 20_000,': 'max_output_tokens: 10_000,',
            "search_context_size: 'high',": "search_context_size: 'medium',",
            'return status === 408 || status === 409 || status === 429 || status >= 500;': 'return status === 408 || status === 409 || status >= 500;',
            '- 1,050 to 1,400 words in contentHtml before the automatically appended FAQ and source list.': '- 1,250 to 1,500 words in contentHtml before the automatically appended FAQ and source list. Aim comfortably above 1,000 words in each language.',
            'if (wordCount(html) < 1000) errors.push(`${language} article is below 1000 words (${wordCount(html)})`);': 'if (wordCount(html) < 850) errors.push(`${language} article is below 850 words (${wordCount(html)})`);',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Patch target missing: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check scripts/generate-daily-history.mjs
          node --check scripts/generate-daily-cover.mjs

      - name: Backfill 27 August
        shell: bash
        run: |
          cat > data/current-updates.js <<'EOF'
          import { dailyTurkishPosts, dailyEnglishPosts } from './current-updates-2026-08-26.js';

          export const currentTurkishPosts = dailyTurkishPosts;
          export const currentEnglishPosts = dailyEnglishPosts;

          function newestDate(items = []) {
            return items.map((item) => item.updated || item.published).filter(Boolean).sort((a, b) => String(b).localeCompare(String(a)))[0] || null;
          }

          export const currentUpdateDate = newestDate([...currentTurkishPosts, ...currentEnglishPosts]);
          EOF
          CONTENT_DATE=2026-08-27 node scripts/generate-daily-history.mjs
          node scripts/generate-daily-cover.mjs

      - name: Backfill 28 August
        shell: bash
        run: |
          CONTENT_DATE=2026-08-28 node scripts/generate-daily-history.mjs
          node scripts/generate-daily-cover.mjs

      - name: Restore current pointer and chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/current-updates-2026-08-29.js')
          s = p.read_text()
          old = "from './current-updates-2026-08-26.js';"
          if old not in s:
            raise SystemExit('Unexpected 29 August previous module')
          p.write_text(s.replace(old, "from './current-updates-2026-08-28.js';", 1))
          PY
          cp /tmp/current-updates-original.js data/current-updates.js

      - name: Verify unique covers and audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for date, prev in [('2026-08-27','2026-08-26'),('2026-08-28','2026-08-27'),('2026-08-29','2026-08-28')]:
            s = Path(f'data/current-updates-{date}.js').read_text()
            if f'current-updates-{prev}.js' not in s:
              raise SystemExit(f'Broken chain: {date} -> {prev}')
          for date in ['2026-08-27','2026-08-28']:
            s = Path(f'data/current-updates-{date}.js').read_text()
            images = re.findall(r"\bimage:\s*['\"]([^'\"]+)['\"]", s)
            if len(images) < 2 or images[0] != images[1]:
              raise SystemExit(f'Image mismatch for {date}')
            image = images[0]
            if not image.startswith(f'/generated-daily/{date}-') or not image.endswith('.webp'):
              raise SystemExit(f'Non-unique cover path for {date}: {image}')
            data = (Path('public') / image.lstrip('/')).read_bytes()
            if len(data) < 20 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit(f'Invalid WebP for {date}')
          if 'current-updates-2026-08-29.js' not in Path('data/current-updates.js').read_text():
            raise SystemExit('Pointer not restored to 29 August')
          PY
          npm ci
          npm run site:audit
          npm run content:check

      - name: Commit backfill
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/generate-daily-history.mjs
          git config user.name 'odyomuh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/current-updates-2026-08-27.js data/current-updates-2026-08-28.js data/current-updates-2026-08-29.js public/generated-daily
          git diff --cached --quiet && exit 1
          git commit -m 'Backfill daily history 2026-08-27 and 2026-08-28'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
