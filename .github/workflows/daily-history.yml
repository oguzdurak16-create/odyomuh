name: Daily Bilingual History

on:
  schedule:
    # Start early enough for text + unique cover + audit to finish before the 08:00 TR verification window.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate today even when a dated file already exists'
        required: false
        default: false
        type: boolean
      content_date:
        description: 'Optional publication date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      text_model:
        description: 'OpenAI text model'
        required: false
        default: gpt-5-mini
        type: choice
        options:
          - gpt-5-mini
  push:
    branches: [main]
    paths:
      - 'scripts/generate-daily-history.mjs'
      - '.github/workflows/daily-history.yml'

permissions:
  contents: write

concurrency:
  group: daily-bilingual-history-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_IMAGE_MODEL: gpt-image-1
      OPENAI_IMAGE_SIZE: 1536x1024
      OPENAI_IMAGE_QUALITY: medium
      OPENAI_IMAGE_FORMAT: webp
      OPENAI_IMAGE_COMPRESSION: '84'
      CONTENT_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.content_date || '' }}
      FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Apply economical and editorial generation limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-daily-history.mjs')
          source = path.read_text()
          replacements = {
              'const MAX_API_ATTEMPTS = 3;': 'const MAX_API_ATTEMPTS = 2;',
              'const MAX_CONTENT_ATTEMPTS = 2;': 'const MAX_CONTENT_ATTEMPTS = 1;',
              'max_output_tokens: 20_000,': 'max_output_tokens: 10_000,',
              "search_context_size: 'high',": "search_context_size: 'medium',",
              'return status === 408 || status === 409 || status === 429 || status >= 500;': 'return status === 408 || status === 409 || status >= 500;',
              '- 1,050 to 1,400 words in contentHtml before the automatically appended FAQ and source list.': '- 1,250 to 1,500 words in contentHtml before the automatically appended FAQ and source list. Aim comfortably above 1,000 words in each language.',
              'if (wordCount(html) < 1000) errors.push(`${language} article is below 1000 words (${wordCount(html)})`);': 'if (wordCount(html) < 850) errors.push(`${language} article is below 850 words (${wordCount(html)})`);',
              "text: 'You are the senior bilingual history editor and fact-checker for ODYOMUH. Use web search actively. Select a genuinely relevant current search trend, connect it to a defensible historical angle, verify claims with authoritative sources, and produce publication-ready Turkish and English long-form articles. Never invent sources, quotations, discoveries, dates or URLs.'": "text: 'You are the senior bilingual history editor and fact-checker for ODYOMUH. Use web search actively. ODYOMUH is first and foremost a history, archaeology, cultural-heritage and historical-mystery publication; current news is only a hook when the historical subject remains dominant. Verify claims with primary, official, academic, museum, university and reputable agency sources. Never use Wikipedia, other wikis, forums, social-media posts, AI-generated pages or content farms as cited sources. Never invent sources, quotations, discoveries, dates or URLs.'",
              '2. The historical connection must be natural and substantial. Do not force a historical angle onto a celebrity scandal, live tragedy, betting topic or disposable meme.': '2. The historical connection must be natural and substantial, and the historical subject must remain the main subject of the article. Do not force a historical angle onto a celebrity scandal, live tragedy, betting topic, disposable meme, stock listing, corporate campaign, bank promotion or short-lived financial news item.',
              '3. If none of the supplied trend candidates supports a strong article, use web search to find a currently trending archaeology discovery, historical anniversary, museum event, cultural heritage issue or major research development. Record the trend source honestly.': '3. If none of the supplied trend candidates supports a strong history-first article, use web search to find a currently trending archaeology discovery, historical anniversary, museum event, cultural heritage issue, archival finding or major research development. Prefer evergreen historical value over generic current-affairs traffic. Record the trend source honestly.',
              '5. Use at least four distinct, working source URLs. Prefer primary excavation pages, universities, museums, government heritage bodies, peer-reviewed research and major reputable news agencies. At least two sources should be primary, official or academic whenever available.': '5. Use at least four distinct, working source URLs. Prefer primary excavation pages, universities, museums, government heritage bodies, peer-reviewed research and major reputable news agencies. At least two sources must be primary, official or academic whenever available. Do not cite Wikipedia, other wikis, forums, social media, AI-generated pages or content farms. Return clean canonical source URLs without utm_*, gclid, fbclid or similar tracking parameters.',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Generation patch target missing: {old}')
              source = source.replace(old, new)

          old_safe_url = """function safeUrl(value = '') {
            const url = new URL(String(value));
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`Unsupported source URL: ${value}`);
            return url.toString();
          }"""
          new_safe_url = """function safeUrl(value = '') {
            const url = new URL(String(value));
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`Unsupported source URL: ${value}`);
            const host = url.hostname.toLowerCase().replace(/^www\./, '');
            const blockedHosts = ['wikipedia.org', 'wikimedia.org', 'fandom.com'];
            if (blockedHosts.some((blocked) => host === blocked || host.endsWith(`.${blocked}`))) {
              throw new Error(`Blocked low-authority source URL: ${value}`);
            }
            for (const key of [...url.searchParams.keys()]) {
              if (/^(utm_|gclid$|fbclid$|mc_cid$|mc_eid$)/i.test(key)) url.searchParams.delete(key);
            }
            url.hash = '';
            return url.toString();
          }"""
          if old_safe_url not in source:
              raise SystemExit('Source URL policy patch target missing')
          source = source.replace(old_safe_url, new_safe_url)
          path.write_text(source)
          PY

      - name: Validate generators
        run: |
          node --check scripts/generate-daily-history.mjs
          node --check scripts/generate-daily-cover.mjs

      - name: Check OpenAI secret
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Generate Turkish and English history articles
        run: node scripts/generate-daily-history.mjs

      - name: Validate generated text before cover
        run: |
          node scripts/check-daily-source-quality.mjs
          node scripts/check-daily-editorial-quality.mjs

      - name: Generate independent AI cover
        run: node scripts/generate-daily-cover.mjs

      - name: Install site dependencies
        run: npm ci

      - name: Validate generated site content
        run: |
          npm run site:audit
          npm run content:check

      - name: Commit daily package
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Daily package already exists and passed validation."
            exit 0
          fi

          git checkout -- scripts/generate-daily-history.mjs
          git config user.name "odyomuh-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/current-updates.js data/current-updates-*.js public/generated-daily

          if git diff --cached --quiet; then
            echo "No daily content changes were staged."
            exit 0
          fi

          DATE_LABEL="${CONTENT_DATE:-$(TZ=Europe/Istanbul date +'%Y-%m-%d')}"
          git commit -m "Daily bilingual history ${DATE_LABEL}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
