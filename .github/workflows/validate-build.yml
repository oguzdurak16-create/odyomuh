name: Validate ODYOMUH build

on:
  push:
    branches:
      - main
      - 'audit-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odyomuh-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-online

      - name: Validate AI cover automation
        run: node --check scripts/generate-daily-cover.mjs

      - name: Run interface and SEO audit
        shell: bash
        run: |
          set -o pipefail
          npm run site:audit 2>&1 | tee audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-audit-log-${{ github.run_id }}
          path: audit.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate English content
        run: npm run content:check

      - name: Production build
        run: npm run build
