name: Validate ODYOMUH build

on:
  push:
    branches:
      - main
      - 'audit-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odyomuh-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-online

      - name: Run interface and SEO audit
        shell: bash
        run: |
          set -o pipefail
          npm run site:audit 2>&1 | tee audit.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-log
          path: audit.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate English content
        run: npm run content:check

      - name: Production build
        run: npm run build
