<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Ancient blacksmith workshop at Seleukeia Sidera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="0.48" stop-color="#4d3525"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.32" stop-color="#ffbd38"/>
      <stop offset="0.68" stop-color="#ef5b13"/>
      <stop offset="1" stop-color="#5d170b"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665442"/>
      <stop offset="1" stop-color="#382d24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#999896"/>
      <stop offset="0.5" stop-color="#4e5152"/>
      <stop offset="1" stop-color="#202223"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72a9ac"/>
      <stop offset="1" stop-color="#18363c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="bricks" width="190" height="92" patternUnits="userSpaceOnUse">
      <rect width="182" height="82" rx="7" fill="url(#stone)" stroke="#211b17" stroke-width="6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect y="70" width="1536" height="680" fill="url(#bricks)" opacity="0.92"/>
  <path d="M890 735V360C890 165 1005 72 1180 72s292 93 292 288v375z" fill="#090a0b" stroke="#27221e" stroke-width="12"/>
  <path d="M80 0h560l300 790H390z" fill="#ffb45e" opacity="0.08" filter="url(#soft)"/>

  <g id="forge">
    <path d="M190 382h450l-55-146H248z" fill="#5a4938" stroke="#201914" stroke-width="10"/>
    <rect x="155" y="378" width="510" height="430" rx="28" fill="#554333" stroke="#1e1713" stroke-width="12"/>
    <ellipse cx="410" cy="584" rx="206" ry="195" fill="#d83e0c" opacity="0.35" filter="url(#glow)"/>
    <rect x="247" y="502" width="330" height="210" rx="12" fill="#120c0a"/>
    <ellipse cx="412" cy="528" rx="165" ry="106" fill="#17100c"/>
    <ellipse cx="412" cy="570" rx="125" ry="91" fill="url(#fire)"/>
    <ellipse cx="412" cy="579" rx="66" ry="46" fill="#fff0a1"/>
  </g>

  <g fill="#ffd85e" stroke="#7b2f0b" stroke-width="2">
    <circle cx="346" cy="388" r="7"/><circle cx="376" cy="330" r="5"/><circle cx="426" cy="350" r="8"/>
    <circle cx="462" cy="296" r="5"/><circle cx="493" cy="390" r="6"/><circle cx="318" cy="306" r="4"/>
    <circle cx="408" cy="272" r="4"/><circle cx="534" cy="333" r="5"/><circle cx="292" cy="360" r="5"/>
    <circle cx="449" cy="420" r="4"/><circle cx="372" cy="420" r="6"/><circle cx="518" cy="430" r="4"/>
  </g>

  <g id="anvil">
    <path d="M615 608h250l66 52-112 38-13 94H685l-14-94-104-38z" fill="url(#metal)" stroke="#222426" stroke-width="9"/>
    <rect x="703" y="786" width="91" height="137" fill="#3a3c3e" stroke="#1d1f20" stroke-width="8"/>
    <path d="M622 925h264l80 59H544z" fill="#282624" stroke="#161514" stroke-width="8"/>
    <rect x="661" y="628" width="198" height="27" rx="12" fill="#ff7b15" stroke="#ffd66b" stroke-width="5"/>
  </g>

  <g id="smith" fill="#211b18">
    <circle cx="642" cy="329" r="44"/>
    <path d="M604 374l85-17 75 230H580z"/>
    <path d="M665 402l132 107-25 36-140-86z"/>
    <path d="M778 505l70-72 24 25-64 88z"/>
  </g>
  <g id="hammer">
    <path d="M848 449l76-83" stroke="#6c5948" stroke-width="14" stroke-linecap="round"/>
    <rect x="899" y="334" width="100" height="49" rx="9" fill="url(#metal)" stroke="#252728" stroke-width="7" transform="rotate(-12 949 359)"/>
  </g>

  <g id="assistant" fill="#181515">
    <circle cx="973" cy="420" r="35"/>
    <path d="M941 459l75-8 57 226H917z"/>
  </g>

  <g id="tools" fill="none" stroke="#81796e" stroke-width="13" stroke-linecap="round">
    <path d="M716 244v284M767 244v284M818 244v284"/>
    <circle cx="716" cy="238" r="27"/><circle cx="767" cy="238" r="27"/><circle cx="818" cy="238" r="27"/>
  </g>

  <g id="horseshoes" fill="none" stroke="#8c8579" stroke-width="18" stroke-linecap="round">
    <path d="M1050 332c0-64 96-64 96 0v72"/><path d="M1180 378c0-64 96-64 96 0v72"/><path d="M1300 300c0-64 96-64 96 0v72"/>
  </g>

  <g id="charcoal">
    <rect x="70" y="770" width="194" height="207" rx="55" fill="#332923" stroke="#171310" stroke-width="9"/>
    <rect x="229" y="794" width="184" height="193" rx="55" fill="#3a2f27" stroke="#171310" stroke-width="9"/>
    <g fill="#080808"><circle cx="122" cy="842" r="9"/><circle cx="171" cy="889" r="12"/><circle cx="218" cy="837" r="8"/><circle cx="291" cy="858" r="11"/><circle cx="350" cy="915" r="13"/><circle cx="267" cy="941" r="8"/><circle cx="112" cy="935" r="12"/></g>
  </g>

  <g id="pool">
    <ellipse cx="1230" cy="842" rx="220" ry="124" fill="#12191b" stroke="#090c0d" stroke-width="10"/>
    <ellipse cx="1230" cy="832" rx="181" ry="90" fill="url(#water)" stroke="#75a7a9" stroke-width="5"/>
    <path d="M1088 822c77 26 205 27 286-5" fill="none" stroke="#b1d2d0" stroke-opacity="0.45" stroke-width="5"/>
  </g>

  <rect width="1536" height="1024" fill="url(#vignette)"/>
</svg>
